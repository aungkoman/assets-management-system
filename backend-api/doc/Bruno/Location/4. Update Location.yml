info:
  name: 4. Update Location
  type: http
  seq: 4

http:
  method: PUT
  url: "{{baseUrl}}/api/v1/locations/{{locationId}}"
  headers:
    - name: Content-Type
      value: application/json
  body:
    type: json
    data: |-
      {
        "name": "Updated Headquarters Name",
        "description": "Updated description text"
      }
  auth:
    type: bearer
    token: "{{token}}"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
