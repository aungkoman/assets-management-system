info:
  name: 3. Get Location by ID
  type: http
  seq: 3

http:
  method: GET
  url: "{{baseUrl}}/api/v1/locations/{{locationId}}"
  auth:
    type: bearer
    token: "{{token}}"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
