info:
  name: 5. Update User
  type: http
  seq: 5

http:
  method: PUT
  url: "{{baseUrl}}/api/users/{{userId}}"
  headers:
    - name: Content-Type
      value: application/json
  body:
    type: json
    data: |-
      {
        "name": "John Doe Updated",
        "email": "john.updated@example.com"
      }
  auth:
    type: bearer
    token: "{{token}}"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
