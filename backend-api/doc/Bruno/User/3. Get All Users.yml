info:
  name: 3. Get All Users
  type: http
  seq: 3

http:
  method: GET
  url: "{{baseUrl}}/api/users?page=20&limit=1"
  params:
    - name: page
      value: "20"
      type: query
    - name: limit
      value: "1"
      type: query
  auth:
    type: bearer
    token: "{{token}}"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false

examples:
  - name: user listing - success
    request:
      url: "{{baseUrl}}/api/users?page=2&limit=1"
      method: GET
      params:
        - name: page
          value: "2"
          type: query
        - name: limit
          value: "1"
          type: query
    response:
      status: 200
      statusText: OK
      headers:
        - name: x-powered-by
          value: Express
        - name: content-type
          value: application/json; charset=utf-8
        - name: content-length
          value: "366"
        - name: etag
          value: W/"16e-8MqF9Rc1kbOxrgF9/kzhxdf3TDs"
        - name: date
          value: Tue, 29 Sep 2026 06:32:02 GMT
        - name: connection
          value: keep-alive
        - name: keep-alive
          value: timeout=5
      body:
        type: json
        data: |-
          {
            "status": true,
            "message": "Users retrieved successfully",
            "data": [
              {
                "_id": "6abb5a50268c801c23b6d42b",
                "name": "John Doe",
                "email": "john2@example.com",
                "isDeleted": false,
                "createdAt": "2026-09-29T06:27:28.031Z",
                "updatedAt": "2026-09-29T06:27:28.031Z",
                "__v": 0
              }
            ],
            "pagination": {
              "currentPage": 2,
              "totalPages": 3,
              "totalItems": 3,
