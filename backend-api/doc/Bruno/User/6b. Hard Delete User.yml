info:
  name: 6b. Hard Delete User
  type: http
  seq: 7

http:
  method: DELETE
  url: "{{baseUrl}}/api/users/{{userId}}/hard-delete"
  auth:
    type: bearer
    token: "{{token}}"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false

examples:
  - name: 401 - Unauthorized
    request:
      url: "{{baseUrl}}/api/users/{{userId}}/hard-delete"
      method: DELETE
    response:
      status: 401
      statusText: Unauthorized
      headers:
        - name: x-powered-by
          value: Express
        - name: content-type
          value: application/json; charset=utf-8
        - name: content-length
          value: "94"
        - name: etag
          value: W/"5e-uT/Um38sRCZe3Bg/gL4KQo8gZnU"
        - name: date
          value: Tue, 29 Sep 2026 06:43:27 GMT
        - name: connection
          value: keep-alive
        - name: keep-alive
          value: timeout=5
      body:
        type: json
        data: |-
          {
            "status": false,
            "message": "Not authorized",
            "error": {
              "user": [
                "User not found or deactivated"
              ]
            }
          }
  - name: 200 - Deleted
    request:
      url: "{{baseUrl}}/api/users/{{userId}}/hard-delete"
      method: DELETE
    response:
      status: 200
      statusText: OK
      headers:
        - name: x-powered-by
          value: Express
        - name: content-type
          value: application/json; charset=utf-8
