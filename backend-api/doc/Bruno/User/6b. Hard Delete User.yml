          value: "78"
        - name: etag
          value: W/"4e-1AOIv3kxP6T27Ud+vNd9wVgS/7Q"
        - name: date
          value: Tue, 29 Sep 2026 06:43:46 GMT
        - name: connection
          value: keep-alive
        - name: keep-alive
          value: timeout=5
      body:
        type: json
        data: |-
          {
            "status": true,
            "message": "User permanently removed from database",
            "data": null
